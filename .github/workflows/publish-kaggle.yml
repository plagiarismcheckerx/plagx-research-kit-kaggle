name: Publish to Kaggle

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PLAGX_CITE_VERSION: "0.2.1"

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build notebook
        run: python build_notebook.py

      - name: Test notebook
        run: |
          pip install -q pandas nbconvert ipykernel
          jupyter nbconvert --to notebook --execute plagx-research-kit.ipynb --output /tmp/executed.ipynb

      - name: Install Kaggle CLI
        run: |
          pip install -q --upgrade kaggle
          sed -i "s/KAGGLE_USERNAME/${KAGGLE_USERNAME}/g" kernel-metadata.json

      # Kaggle notebooks have no internet without phone verification, and
      # unverified accounts cannot create datasets. A small script kernel
      # writes the plagx-cite wheel to its output, which the notebook attaches.
      - name: Push plagx-cite wheel kernel
        run: |
          pip download -q --no-deps "plagx-cite==${PLAGX_CITE_VERSION}" -d /tmp/wheel
          python make_wheel_kernel.py /tmp/wheel/*.whl "${KAGGLE_USERNAME}"
          kaggle kernels push -p wheel-kernel
          for i in $(seq 1 40); do
            status=$(kaggle kernels status "${KAGGLE_USERNAME}/plagx-cite-wheel" 2>&1 || true)
            echo "$status"
            echo "$status" | grep -qi complete && break
            echo "$status" | grep -qiE "error|cancel" && exit 1
            sleep 15
          done

      - name: Push notebook to Kaggle
        run: kaggle kernels push -p .
