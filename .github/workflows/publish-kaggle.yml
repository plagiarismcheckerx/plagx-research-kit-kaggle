name: Publish to Kaggle

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PLAGX_CITE_VERSION: "0.2.1"

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build notebook
        run: python build_notebook.py

      - name: Test notebook
        run: |
          pip install -q pandas nbconvert ipykernel
          jupyter nbconvert --to notebook --execute plagx-research-kit.ipynb --output /tmp/executed.ipynb

      - name: Install Kaggle CLI
        run: |
          pip install -q --upgrade kaggle
          sed -i "s/KAGGLE_USERNAME/${KAGGLE_USERNAME}/g" kernel-metadata.json

      # Kaggle notebooks have no internet without phone verification, so
      # plagx-cite is attached as a dataset holding its PyPI wheel.
      # Kaggle may answer 499 even when the dataset was created, so a failed
      # upload is not fatal; the notebook run shows whether the wheel is there.
      - name: Upload plagx-cite wheel dataset (first run only)
        run: |
          if kaggle datasets files "${KAGGLE_USERNAME}/plagx-cite-wheel" 2>/dev/null | grep -q '\.whl'; then
            echo "Dataset already has the wheel"
            exit 0
          fi
          mkdir wheel && cp LICENSE wheel/
          pip download -q --no-deps "plagx-cite==${PLAGX_CITE_VERSION}" -d wheel
          cat > wheel/dataset-metadata.json <<EOF
          {
            "title": "plagx-cite wheel",
            "id": "${KAGGLE_USERNAME}/plagx-cite-wheel",
            "subtitle": "Offline install of the MIT-licensed plagx-cite package from PyPI",
            "licenses": [{"name": "other"}]
          }
          EOF
          kaggle datasets create -p wheel --public || echo "Upload reported an error; continuing"
          sleep 60

      - name: Push notebook to Kaggle
        run: kaggle kernels push -p .
