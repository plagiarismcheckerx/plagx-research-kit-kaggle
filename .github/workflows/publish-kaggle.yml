name: Publish to Kaggle

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PLAGX_CITE_VERSION: "0.2.1"

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build notebook
        run: python build_notebook.py

      - name: Test notebook
        run: |
          pip install -q pandas nbconvert ipykernel
          jupyter nbconvert --to notebook --execute plagx-research-kit.ipynb --output /tmp/executed.ipynb
          ls output

      - name: Install Kaggle CLI
        run: |
          pip install -q --upgrade kaggle
          sed -i "s/KAGGLE_USERNAME/${KAGGLE_USERNAME}/g" kernel-metadata.json

      # Companion dataset: the templates the notebook produces, plus the
      # plagx-cite wheel so the notebook runs without internet (Kaggle needs
      # phone verification for internet). Kaggle may answer 499 even when the
      # upload worked, so upload errors are not fatal.
      - name: Upload Plagx Research Kit templates dataset
        run: |
          mkdir dataset
          cp output/* LICENSE dataset/
          pip download -q --no-deps "plagx-cite==${PLAGX_CITE_VERSION}" -d dataset
          python - <<'PY'
          import json, os
          json.dump({
              "title": "Plagx Research Kit - templates",
              "id": f"{os.environ['KAGGLE_USERNAME']}/plagx-research-kit-templates",
              "subtitle": "Source log, literature matrix and research plan templates for students",
              "description": open("dataset-description.md", encoding="utf-8").read(),
              "licenses": [{"name": "other"}],
              "keywords": ["education", "research"],
          }, open("dataset/dataset-metadata.json", "w"), indent=2)
          PY
          if kaggle datasets files "${KAGGLE_USERNAME}/plagx-research-kit-templates" >/dev/null 2>&1; then
            kaggle datasets version -p dataset -m "Update templates" || echo "Version upload reported an error; continuing"
          else
            kaggle datasets create -p dataset --public || echo "Upload reported an error; continuing"
          fi
          sleep 60

      - name: Push notebook to Kaggle
        run: kaggle kernels push -p .
